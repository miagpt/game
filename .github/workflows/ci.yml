name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Syntax check
        run: for f in assets/js/*.js happy-home/*.js tools/*.mjs; do node --check "$f"; done
      - name: Browser-free end-to-end
        run: |
          npm install --no-save jsdom@26.1.0 esbuild@0.25.0
          npm run test:e2e
      - name: Covers present
        run: |
          test -f assets/covers/01-sunset.jpg
          test -f assets/covers/full/10-home.jpg
          test -f assets/img/brands/mangpt.svg
          test -f assets/img/og-cover.jpg
      - run: npm run build
