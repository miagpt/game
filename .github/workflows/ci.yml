name: Tests
on:
  pull_request:
  push:
    branches: [main, arena/c971cd3c-game]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check assets/js/main.js
      - run: node tools/build-site.mjs
