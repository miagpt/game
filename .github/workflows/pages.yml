name: Publish family game to GitHub Pages
on:
  push:
    branches: [main, arena/c971cd3c-game]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm install --no-save --ignore-scripts puppeteer-core@24.31.0
      - name: Browser end-to-end
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          npm run test:e2e
      - run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
